[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-setup"
version = "0.1.0"
description = "Provider-neutral control plane and Setup TUI for configuring AI agents with FlossWare capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "curses-tui @ git+https://github.com/FlossWare/curses-tui.git@84458a18ae4c47a9f31d7233f5a6cf565c0c2c1f",
]

[tool.setuptools.packages.find]
include = ["flossware_setup*"]

[tool.setuptools.package-data]
"flossware_setup.profiles" = ["*.toml"]

[project.scripts]
flossware-setup = "flossware_setup.tui:main"
flossware-ai = "flossware_setup.cli:main"

[project.optional-dependencies]
core = [
    "model-router-ai @ git+https://github.com/FlossWare/model-gateway.git@98ea2b3d27c483b7d77ad5770d097a79872c3785",
    "resilience-ai @ git+https://github.com/FlossWare/resilience-ai.git@b4a11f80bfe4b9a879b95b724d143d92cb548c47",
    "output-validation @ git+https://github.com/FlossWare/output-validation.git@0b5e21dd9c94eb41a49eede6ba6d865a261707d2",
]
all = [
    "model-router-ai @ git+https://github.com/FlossWare/model-gateway.git@98ea2b3d27c483b7d77ad5770d097a79872c3785",
    "resilience-ai @ git+https://github.com/FlossWare/resilience-ai.git@b4a11f80bfe4b9a879b95b724d143d92cb548c47",
    "output-validation @ git+https://github.com/FlossWare/output-validation.git@0b5e21dd9c94eb41a49eede6ba6d865a261707d2",
    "consensus-ai @ git+https://github.com/FlossWare/consensus.git@4570e0429c4abee5a6b68d964786cb90e07282d8",
    "evaluation-ai @ git+https://github.com/FlossWare/evaluation.git@368c222f60a491e5022f8472d954c947bd47a9bf",
    "observability-ai @ git+https://github.com/FlossWare/observability.git@c4c563da098aa75d4789069fe523403fdd8bd9be",
    "security-ai @ git+https://github.com/FlossWare/security.git@79c11558f39e966f15d0c50a955acded2e252f32",
    "rag @ git+https://github.com/FlossWare/rag.git@8bc0f6ae899b39ae6708c7b158d82529adbc2209",
    "optimization @ git+https://github.com/FlossWare/optimization.git@3044c7cdb88a2aa4b6278b35ec92d8a61b79d5f3",
]

[project.urls]
Homepage = "https://github.com/FlossWare/agent-setup"
Repository = "https://github.com/FlossWare/agent-setup"
